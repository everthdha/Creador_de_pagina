<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexUI | Editor Estilo Canva</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GrapesJS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/grapesjs/0.21.2/css/grapes.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/grapesjs/0.21.2/grapes.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0d0d0d; color: #ffffff; }

        /* ====== GRAPESJS OVERRIDES (Dark Mode) ====== */
        .gjs-pn-panels, .gjs-pn-commands, .gjs-pn-options { display: none !important; }
        
        .gjs-cv-canvas {
            top: 24px !important;
            bottom: 24px !important;
            left: 24px !important;
            right: 24px !important;
            width: calc(100% - 48px) !important;
            height: calc(100% - 48px) !important;
            border-radius: 12px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4) !important;
            background-color: #ffffff !important;
        }
        /* El fondo detrás del lienzo (el escritorio) */
        .gjs-editor {
            background-color: #0d0d0d !important;
        }

        .gjs-frame { background: transparent !important; }

        /* Selector Highlight púrpura */
        .gjs-cv-canvas .gjs-highlighter,
        .gjs-cv-canvas .gjs-highlighter-sel {
            outline: 2px solid #8b5cf6 !important;
            box-shadow: 0 0 15px rgba(139,92,246,0.3) !important;
            border: none !important;
        }

        /* ====== TOP BAR (HORIZONTAL STYLE MANAGER) ====== */
        /* Forzar la barra a ser una sola línea horizontal perfecta */
        .gjs-sm-sectors {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            align-items: center !important;
            height: 100% !important;
            background: transparent !important;
            overflow-x: auto !important;
        }
        .gjs-sm-sector {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            border: none !important;
            padding: 0 8px !important;
            margin: 0 !important;
        }
        /* Ocultar los títulos de sector gordos (General, Flex, etc.) para ahorrar espacio */
        .gjs-sm-title {
            display: none !important; 
        }
        /* Alineación de las propiedades individuales */
        .gjs-sm-properties {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            align-items: center !important;
        }
        .gjs-sm-property {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            margin-right: 12px !important;
            padding: 0 !important;
        }
        /* Etiquetas de texto de las propiedades (pequeñas y sutiles) */
        .gjs-sm-property__label {
            font-size: 10px !important;
            color: #888 !important;
            margin-right: 6px !important;
            text-transform: capitalize !important;
        }
        /* Inputs y selectores delgados y elegantes */
        .gjs-field, 
        .gjs-field-colorp-c, 
        .gjs-select {
            background-color: #1a1a1a !important;
            border: 1px solid #222 !important;
            border-radius: 4px !important;
            height: 24px !important;
            color: #e5e5e5 !important;
            font-size: 11px !important;
            padding: 0 6px !important;
            box-shadow: none !important;
        }
        /* Scrollbar invisible para la top bar */
        .gjs-sm-sectors::-webkit-scrollbar { display: none; }

        /* ====== LEFT PANEL BLOCKS (Diseños) ====== */
        .gjs-blocks-c { padding: 15px !important; display: flex; flex-wrap: wrap; gap: 8px; background-color: transparent !important; }
        .gjs-block { 
            width: 100% !important; 
            padding: 6px 12px !important;
            font-size: 12px !important;
            min-height: auto !important;
            border: 1px solid rgba(255,255,255,0.05) !important; 
            border-radius: 6px !important;
            color: #a3a3a3 !important; 
            background: #1a1a1a !important;
            transition: all 0.2s;
            display: flex !important;
            align-items: center !important;
            text-align: left !important;
        }
        .gjs-block:hover { border-color: #8b5cf6 !important; color: #8b5cf6 !important; }

        /* Layers Panel (Capas) */
        .gjs-pn-views-container { height: 100% !important; padding: 0 !important; }
        .gjs-layer { border-bottom: 1px solid rgba(255,255,255,0.05) !important; }
        .gjs-layer-title { color: #d4d4d4 !important; }
        .gjs-layer-active { background-color: rgba(139,92,246,0.1) !important; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* Tab Logic */
        .dynamic-tab { display: none; height: 100%; flex-direction: column; }
        .dynamic-tab.active { display: flex; }
        .icon-btn.active { background-color: rgba(255,255,255,0.1) !important; color: #8b5cf6 !important; border-right: 2px solid #8b5cf6; }
    </style>
</head>
<body class="flex h-screen w-screen overflow-hidden bg-[#0d0d0d] text-white">

    <!-- OVERLAY DE CARGA AI -->
    <div id="ai-loading-overlay" class="fixed inset-0 z-50 bg-[#0d0d0d]/90 backdrop-blur-sm flex flex-col items-center justify-center hidden">
        <div class="w-20 h-20 mb-6 relative">
            <div class="absolute inset-0 rounded-full border-t-2 border-purple-500 animate-spin"></div>
            <div class="absolute inset-2 rounded-full border-t-2 border-indigo-500 animate-spin" style="animation-direction: reverse;"></div>
            <div class="absolute inset-4 rounded-full border-t-2 border-white animate-spin"></div>
        </div>
        <h2 class="text-2xl font-bold text-white mb-2">✨ La IA está construyendo tu visión...</h2>
        <p class="text-gray-400">Diseñando estructura, aplicando Tailwind y colores.</p>
    </div>

    <!-- ====== LADO IZQUIERDO: Estilo Canva ====== -->
    <div class="flex h-full flex-shrink-0 z-20 shadow-[5px_0_20px_rgba(0,0,0,0.5)]">
        
        <!-- 1. Barra de Iconos (Adelgazada a w-14) -->
        <nav class="w-14 bg-[#050505] border-r border-white/5 flex flex-col items-center py-6 gap-6 relative z-10">
            <!-- Logo / Menu -->
            <button class="mb-4 text-purple-500 hover:scale-110 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </button>

            <!-- Pestañas -->
            <button onclick="switchTab('tab-blocks', this)" class="icon-btn active w-full py-4 flex flex-col items-center gap-1.5 text-gray-500 hover:text-gray-300 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="text-[9px] font-medium tracking-wide">Bloques</span>
            </button>
            
            <button onclick="switchTab('tab-text', this)" class="icon-btn w-full py-4 flex flex-col items-center gap-1.5 text-gray-500 hover:text-gray-300 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
                <span class="text-[9px] font-medium tracking-wide">Texto</span>
            </button>

            <button onclick="switchTab('tab-ai', this)" class="icon-btn w-full py-4 flex flex-col items-center gap-1.5 text-purple-400 hover:text-purple-300 transition-colors relative">
                <span class="absolute top-3 right-3 w-1.5 h-1.5 bg-purple-500 rounded-full animate-pulse"></span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                <span class="text-[9px] font-medium tracking-wide">Copilot</span>
            </button>

            <button onclick="switchTab('tab-layers', this)" class="icon-btn w-full py-4 flex flex-col items-center gap-1.5 text-gray-500 hover:text-gray-300 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                <span class="text-[9px] font-medium tracking-wide">Capas</span>
            </button>

            <!-- Perfil -->
            <div class="mt-auto pb-4">
                <button class="w-7 h-7 rounded-full overflow-hidden border border-white/10 shadow-sm opacity-80 hover:opacity-100 transition-opacity">
                    <img src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" alt="Perfil">
                </button>
            </div>
        </nav>

        <!-- 2. Panel Dinámico Expandible (Adelgazado a w-64) -->
        <aside class="w-64 bg-[#121212] border-r border-white/5 h-full relative z-0">
            
            <!-- Pestaña: Diseños (Bloques de GrapesJS) -->
            <div id="tab-blocks" class="dynamic-tab active">
                <div class="px-4 py-3 border-b border-white/5">
                    <h3 class="font-bold text-xs">Diseños y Bloques</h3>
                    <p class="text-[10px] text-gray-400 mt-0.5">Arrastra elementos al lienzo</p>
                </div>
                <div class="flex-1 overflow-y-auto" id="gjs-blocks"></div>
            </div>

            <!-- Pestaña: Texto -->
            <div id="tab-text" class="dynamic-tab">
                <div class="px-4 py-3 border-b border-white/5">
                    <h3 class="font-bold text-xs">Tipografía</h3>
                </div>
                <div class="p-4 space-y-3">
                    <button id="add-h1" class="w-full p-3 bg-[#1a1a1a] border border-white/10 rounded-md hover:border-purple-500/50 transition-colors text-left text-lg font-bold">Añadir Título</button>
                    <button id="add-h3" class="w-full p-3 bg-[#1a1a1a] border border-white/10 rounded-md hover:border-purple-500/50 transition-colors text-left text-sm font-semibold">Añadir Subtítulo</button>
                    <button id="add-p" class="w-full p-3 bg-[#1a1a1a] border border-white/10 rounded-md hover:border-purple-500/50 transition-colors text-left text-xs text-gray-400">Añadir cuerpo de texto</button>
                </div>
            </div>

            <!-- Pestaña: IA Copilot (Chat) -->
            <div id="tab-ai" class="dynamic-tab">
                <div class="px-4 py-3 border-b border-white/5 flex items-center justify-between">
                    <div>
                        <h3 class="font-bold text-xs flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> NexUI Copilot
                        </h3>
                    </div>
                </div>
                
                <div id="chat-history" class="flex-1 overflow-y-auto p-3 space-y-3 bg-[#0a0a0a]">
                    <div class="flex gap-2">
                        <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 flex-shrink-0 flex items-center justify-center text-white shadow-md">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                        </div>
                        <div class="bg-[#1a1a1a] border border-white/5 p-2.5 rounded-xl rounded-tl-none text-[11px] text-gray-300 leading-relaxed shadow-sm">
                            Sistema de diseño IA listo. Solicita componentes completos o modificaciones específicas.
                        </div>
                    </div>
                </div>

                <div class="p-3 bg-[#121212] border-t border-white/5 flex-shrink-0">
                    <div class="relative flex items-center">
                        <input id="chat-input" type="text" placeholder="Describe tu diseño..." class="w-full pl-3 pr-8 py-2 bg-[#1a1a1a] border border-white/10 rounded-lg text-xs focus:outline-none focus:border-purple-500/50 focus:ring-1 focus:ring-purple-500/50 transition-all text-white">
                        <button id="chat-send" class="absolute right-1.5 w-6 h-6 bg-purple-600 hover:bg-purple-500 text-white rounded-md flex items-center justify-center transition-colors shadow-sm">
                            <svg class="w-3 h-3 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V6m0 0l-8 8m8-8l8 8"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Pestaña: Capas -->
            <div id="tab-layers" class="dynamic-tab">
                <div class="px-4 py-3 border-b border-white/5">
                    <h3 class="font-bold text-xs">Capas del Lienzo</h3>
                </div>
                <div class="flex-1 overflow-y-auto text-xs" id="gjs-layers"></div>
            </div>

        </aside>
    </div>

    <!-- ====== LADO DERECHO: Top Bar + Lienzo ====== -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden bg-[#09090b]">
        
        <!-- 3. Barra Superior Contextual (Top Bar - h-12, bg-[#0a0a0a]) -->
        <header class="h-12 bg-[#0a0a0a] border-b border-white/5 flex items-center w-full flex-shrink-0 relative shadow-md z-10 overflow-hidden px-4">
            <!-- Título / Controles Izquierdos -->
            <div class="flex items-center gap-3 border-r border-white/10 pr-4 mr-2">
                <div class="text-[10px] font-medium text-gray-400 bg-[#1a1a1a] px-2 py-0.5 rounded border border-white/5">nexui.dev/editor</div>
            </div>
            
            <!-- Aquí GrapesJS inyectará el Style Manager en HORIZONTAL -->
            <div id="top-bar-properties" class="flex-1 h-full flex items-center"></div>

            <!-- Controles Derechos -->
            <div class="ml-auto pl-4 border-l border-white/10 flex items-center gap-2">
                <button class="px-3 py-1 bg-white text-black text-[11px] font-bold rounded hover:bg-gray-200 transition-colors shadow-[0_0_10px_rgba(255,255,255,0.1)]">Exportar</button>
            </div>
        </header>

        <!-- 4. Lienzo de GrapesJS (Maximizado) -->
        <main class="flex-1 relative w-full h-full overflow-hidden">
            <div id="gjs" class="absolute inset-0 w-full h-full"></div>
        </main>
    </div>


    <!-- ====== 5. INTEGRIDAD DEL JS ====== -->
    <script>
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.dynamic-tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.icon-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        const editor = grapesjs.init({
            container: '#gjs',
            height: '100%',
            width: '100%',
            storageManager: { type: 'remote', autosave: false },
            panels: { defaults: [] }, 
            
            canvas: {
                scripts: ['https://cdn.tailwindcss.com']
            },

            i18n: {
                locale: 'es',
                localeFallback: 'en',
                messages: {
                    es: {
                        styleManager: {
                            empty: 'Selecciona un elemento en el lienzo',
                            sectors: {
                                general: 'General',
                                layout: 'Display',
                                typography: 'Texto',
                                decorations: 'Fondo',
                                extra: 'Bordes',
                                dimension: 'Tamaño'
                            },
                            properties: {
                                'background-color': 'Fondo',
                                'border-radius': 'Radio',
                                'border': 'Borde',
                                'width': 'Ancho',
                                'height': 'Alto',
                                'margin': 'Margen',
                                'padding': 'Relleno',
                                'font-family': 'Fuente',
                                'font-size': 'Tamaño',
                                'color': 'Color',
                                'text-align': 'Alineación'
                            }
                        }
                    }
                }
            },

            styleManager: { appendTo: '#top-bar-properties' },
            blockManager: {
                appendTo: '#gjs-blocks',
                blocks: [
                    { id: 'section', label: '<b>Sección Vacía</b>', content: '<section class="p-10 min-h-[200px] text-white flex flex-col items-center justify-center border-2 border-dashed border-gray-700"></section>' },
                    { id: 'grid2', label: 'Grid 2 Columnas', content: '<div class="grid grid-cols-2 gap-4 p-4 min-h-[100px] border border-gray-800"><div class="bg-gray-900 p-4">Col 1</div><div class="bg-gray-900 p-4">Col 2</div></div>' },
                    { id: 'btn', label: 'Botón', content: '<button class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-2 rounded-lg font-medium shadow-lg transition-colors">Click Aquí</button>' }
                ]
            },
            layerManager: { appendTo: '#gjs-layers' }
        });

        document.getElementById('add-h1').addEventListener('click', () => editor.addComponents('<h1 class="text-4xl md:text-6xl font-bold text-white mb-4">Título Principal</h1>'));
        document.getElementById('add-h3').addEventListener('click', () => editor.addComponents('<h3 class="text-xl md:text-2xl font-semibold text-gray-200 mb-2">Subtítulo</h3>'));
        document.getElementById('add-p').addEventListener('click', () => editor.addComponents('<p class="text-base text-gray-400 mb-4">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>'));

        const loadingOverlay = document.getElementById('ai-loading-overlay');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        const chatHistory = document.getElementById('chat-history');

        function appendUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'flex justify-end mt-3 mb-3';
            div.innerHTML = `<div class="bg-purple-600/20 border border-purple-500/30 text-purple-100 px-3 py-2 rounded-xl rounded-tr-none text-[11px] max-w-[85%]">${text}</div>`;
            chatHistory.appendChild(div);
            scrollToBottom();
        }

        function appendTypingIndicator() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = 'flex gap-2 mb-3';
            div.innerHTML = `
                <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 flex-shrink-0 flex items-center justify-center text-white shadow-md">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                </div>
                <div class="bg-[#1a1a1a] border border-white/5 px-3 py-2 rounded-xl rounded-tl-none shadow-sm flex items-center gap-1 text-gray-400">
                    <div class="w-1 h-1 bg-purple-500 rounded-full animate-bounce"></div>
                    <div class="w-1 h-1 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                    <div class="w-1 h-1 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                </div>`;
            chatHistory.appendChild(div);
            scrollToBottom();
        }

        function appendAIMessage(text) {
            const indicator = document.getElementById('typing-indicator');
            if(indicator) indicator.remove();

            const div = document.createElement('div');
            div.className = 'flex gap-2 mb-3';
            div.innerHTML = `
                <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 flex-shrink-0 flex items-center justify-center text-white shadow-md">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                </div>
                <div class="bg-[#1a1a1a] border border-white/5 p-2.5 rounded-xl rounded-tl-none text-[11px] text-gray-300 leading-relaxed shadow-sm">
                    ${text}
                </div>`;
            chatHistory.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function requestAIGeneration(payload, isInitialLoad = false) {
            try {
                const response = await fetch('/api/ia/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    if(!isInitialLoad) appendAIMessage(data.mensaje);
                    if (data.codigo_html) {
                        if (isInitialLoad) {
                            editor.setComponents(data.codigo_html);
                        } else {
                            editor.addComponents(data.codigo_html);
                        }
                    }
                } else {
                    if(!isInitialLoad) appendAIMessage("Error en IA: " + (data.error || "Desconocido"));
                    else alert("Error autogenerando: " + data.error);
                }
            } catch (error) {
                if(!isInitialLoad) appendAIMessage("Error de red.");
                else alert("Error de red al autogenerar.");
            } finally {
                if (isInitialLoad) {
                    loadingOverlay.classList.add('hidden');
                }
            }
        }

        async function sendMessage() {
            const prompt = chatInput.value.trim();
            if (!prompt) return;

            chatInput.value = '';
            appendUserMessage(prompt);
            appendTypingIndicator();
            
            await requestAIGeneration({ prompt: prompt }, false);
        }

        chatSend.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // AUTOGENERACIÓN INICIAL DESDE DASHBOARD
        const sitePrefsStr = '{{ site_prefs_json|escapejs }}';
        if (sitePrefsStr && sitePrefsStr !== 'null') {
            const sitePrefs = JSON.parse(sitePrefsStr);
            if (sitePrefs && sitePrefs.nicho) {
                loadingOverlay.classList.remove('hidden');
                switchTab('tab-ai', document.querySelector('.icon-btn:nth-child(4)'));
                const payload = {
                    prompt: sitePrefs.prompt_extra || "Crea un landing page completo y moderno.",
                    nicho: sitePrefs.nicho,
                    colores: sitePrefs.colores
                };
                requestAIGeneration(payload, true);
            }
        }
    </script>
</body>
</html>
